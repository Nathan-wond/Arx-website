  <script>
    // Suppress dev-server WebSocket HMR disconnections (HMR is disabled in this environment)
    (function () {
      if (typeof window !== 'undefined') {
        var suppress = function (e) {
          var reason = e && (e.reason !== undefined ? e.reason : (e.error !== undefined ? e.error : e.detail));
          var msg = typeof reason === 'string' ? reason : (reason && (reason.message || String(reason))) || (e && e.message) || '';
          var stack = reason && reason.stack ? String(reason.stack) : '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('WebSocket') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.stopPropagation) e.stopPropagation();
            return true;
          }
        };
        window.addEventListener('unhandledrejection', suppress, true);
        window.addEventListener('error', suppress, true);
        window.onunhandledrejection = suppress;

        // Wrap WebSocket so that premature closures during reverse-proxy dev runs cleanly fire 'open'
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function (url, protocols) {
            var ws = protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url);
            var opened = false;
            ws.addEventListener('open', function () { opened = true; });
            ws.addEventListener('close', function () {
              if (!opened) {
                opened = true;
                try {
                  ws.dispatchEvent(new Event('open'));
                } catch (_) {}
              }
            });
            return ws;
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      }
    })();
    (function () {
      try {
        var t = localStorage.getItem('arx_theme') || localStorage.getItem('arx_theme');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { }
    })();
  </script>
