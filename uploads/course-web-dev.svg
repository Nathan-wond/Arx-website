<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg-grad-web" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="icon-grad-web" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC6454" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow-web" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad-web)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Glow Behind Material Icon -->
  <circle cx="400" cy="200" r="110" fill="#FC6454" opacity="0.16" filter="url(#glow-web)" />

  <!-- Badge Pill -->
  <g transform="translate(400, 72)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#FC6454" fill-opacity="0.12" stroke="#FC6454" stroke-opacity="0.3" stroke-width="1" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FC6454" letter-spacing="2" text-anchor="middle">CURRICULUM TRACK</text>
  </g>

  <!-- Material Icon: Devices / Web Design & Development (24x24 standard viewBox scaled to 160px) -->
  <!-- Official Material Symbol "devices": Monitor + Phone + Tablet outline -->
  <g transform="translate(320, 120) scale(6.666)" fill="url(#icon-grad-web)">
    <path d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 9h-4v-7h4v7z" />
  </g>

  <!-- Module Title & Tagline -->
  <text x="400" y="360" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="28" fill="#F1F7F4" letter-spacing="-0.5" text-anchor="middle">
    Web Design &amp; Development
  </text>
  <text x="400" y="392" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#94A3B8" text-anchor="middle">
    HTML5 · CSS3 &amp; Responsive UI · Modern JavaScript · Full-Stack Basics
  </text>
</svg>
